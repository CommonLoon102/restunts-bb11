      &lt;span class=&quot;control-value&quot;&gt;&lt;span&gt;Key pressed and held at&lt;/span&gt;&lt;output id=&quot;ss-key-value&quot; class=&quot;tabular-nums&quot;&gt;62 ms&lt;/output&gt;&lt;/span&gt;
      &lt;input id=&quot;ss-key&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;51&quot; max=&quot;149&quot; step=&quot;1&quot; value=&quot;62&quot;&gt;
    &lt;/label&gt;
  &lt;/div&gt;
  &lt;svg class=&quot;diagram tabular-nums cursor-interaction&quot; role=&quot;img&quot; aria-labelledby=&quot;ss-svg-title ss-svg-description&quot;&gt;
    &lt;title id=&quot;ss-svg-title&quot;&gt;Aligned timeline of input, physics, and displayed pictures&lt;/title&gt;
    &lt;desc id=&quot;ss-svg-description&quot;&gt;&lt;/desc&gt;
    &lt;g id=&quot;ss-drawing&quot;&gt;&lt;/g&gt;
  &lt;/svg&gt;
  &lt;div class=&quot;legend text-small&quot;&gt;
    &lt;span&gt;&lt;span class=&quot;swatch physics-swatch&quot;&gt;&lt;/span&gt;K = completed physics keyframe&lt;/span&gt;
    &lt;span&gt;&lt;span class=&quot;swatch picture-swatch&quot;&gt;&lt;/span&gt;M = midpoint of adjacent keyframes&lt;/span&gt;
    &lt;span&gt;&lt;span class=&quot;swatch input-swatch&quot;&gt;&lt;/span&gt;Contains the new input&lt;/span&gt;
  &lt;/div&gt;
  &lt;div id=&quot;ss-selected&quot; class=&quot;text-small&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById('ss-timing');
      const svg = root.querySelector('.diagram');
      const drawing = root.querySelector('#ss-drawing');
      const inspect = root.querySelector('#ss-inspect');
      const key = root.querySelector('#ss-key');
      const state = { time:110, press:62 };
      const NS = 'http://www.w3.org/2000/svg';
      const limits = { start:25, end:225 };
      let lastWidth = 0;

      function el(tag, attrs, text) {
        const node = document.createElementNS(NS, tag);
        Object.entries(attrs || {}).forEach(([name,value]) =&gt; node.setAttribute(name,String(value)));
        if (text !== undefined) node.textContent = text;
        drawing.appendChild(node);
        return node;
      }
      function label(x,y,text,attrs={}) { return el('text',{x,y,...attrs},text); }
      function sampleAt(press) { return Math.ceil(press / 50) * 50; }
      function save() {
        if (window.openai &amp;&amp; window.openai.setWidgetState) {
          window.openai.setWidgetState({modelContent:{inspect_time_ms:state.time,key_press_ms:state.press},privateContent:null}).catch(() =&gt; {});
        }
      }
      function restore(saved) {
        const data = saved &amp;&amp; saved.modelContent;
        if (data &amp;&amp; Number.isFinite(data.inspect_time_ms)) state.time = Math.max(50,Math.min(220,data.inspect_time_ms));
        if (data &amp;&amp; Number.isFinite(data.key_press_ms)) state.press = Math.max(51,Math.min(149,data.key_press_ms));
      }
      function render() {
        const w = root.getBoundingClientRect().width;
        lastWidth = w;
        const narrow = w &lt; 480;
        const left = 12, right = w - 12;
        const x = t =&gt; left + (t - limits.start) / (limits.end - limits.start) * (right-left);
        const sampled = sampleAt(state.press);
        const fullAt = sampled + 25;
        const physics = Math.floor(state.time / 50) * 50;
        const presentation = Math.floor(state.time / 25) * 25;
        const pose = presentation - 25;
        const midpoint = presentation % 50 === 0;
        const visible = (midpoint ? 'M' : 'K') + pose;
        const pictureAge = state.time - pose;
        const physicsGap = physics - pose;
        const inputDelay = sampled - state.press;
        const fullDelay = fullAt - state.press;
        drawing.replaceChildren();
        svg.setAttribute('viewBox',`0 0 ${w} 515`);
        svg.setAttribute('height','515');
        inspect.value=state.time; key.value=state.press;
        root.querySelector('#ss-time-value').textContent=state.time+' ms';
        root.querySelector('#ss-key-value').textContent=state.press+' ms';

        label(left,17,'Real time (ms)',{class:'lane-label'});
        for (let t=25;t&lt;=225;t+=25) {
          const isEdge=t===25 || t===225;
          [[42,51],[76,96],[143,177],[211,245]].forEach(([y1,y2])=&gt;el('line',{x1:x(t),x2:x(t),y1,y2,class:'grid'}));
          if (!narrow || t%50===0) label(x(t),36,t,{'text-anchor':isEdge?(t===25?'start':'end'):'middle',class:'axis-label'});
        }
        const cursor=x(state.time);
        [[44,53],[76,96],[138,181],[206,249]].forEach(([y1,y2])=&gt;el('line',{x1:cursor,x2:cursor,y1,y2,class:'cursor'}));

        label(left,65,`User input · key down at ${state.press} ms`,{class:'lane-label'});
        el('rect',{x:x(state.press),y:76,width:x(225)-x(state.press),height:18,class:'held'});
        el('circle',{cx:x(state.press),cy:85,r:5,class:'input','data-tooltip':`Key pressed at ${state.press} ms; held through later samples.`});
        const keyLabelAnchor = x(state.press) &lt; w/2 ? 'start' : 'end';
        label(x(state.press)+(keyLabelAnchor==='start'?9:-9),89,'held',{'text-anchor':keyLabelAnchor});
        for(let t=50;t&lt;=200;t+=50) {
          el('line',{x1:x(t),x2:x(t),y1:76,y2:94,stroke:'var(--foreground)','stroke-width':1,'data-tooltip':`Input sampled at ${t} ms: ${t&gt;=sampled?'key down':'key up'}.`});
        }
        label(x(sampled),108,`${sampled} ms: sampled`,{'text-anchor':'middle'});
        [[112,120],[177,188],[205,211]].forEach(([y1,y2])=&gt;el('line',{x1:x(sampled),x2:x(sampled),y1,y2,stroke:'var(--viz-series-3)','stroke-width':2,'stroke-dasharray':'3 4'}));

        label(left,133,`Latest physics at ${state.time} ms · K${physics}`,{class:'lane-label'});
        for(let t=0;t&lt;225;t+=50) {
          const start=Math.max(25,t), end=Math.min(225,t+50);
          const tip=`K${t}: completed physics for ${t} ms. Held until ${t+50} ms. ${t&gt;=sampled?'Includes the held key.':'Does not include the new key.'}`;
          el('rect',{x:x(start)+1,y:143,width:x(end)-x(start)-2,height:34,rx:2,class:'physics','data-tooltip':tip});
          if(t&gt;=sampled) el('rect',{x:x(start)+1,y:173,width:x(end)-x(start)-2,height:4,class:'input'});
          label((x(start)+x(end))/2,164,'K'+t,{'text-anchor':'middle'});
        }
        el('path',{d:`M ${cursor-4} 138 L ${cursor+4} 138 L ${cursor} 143 Z`,fill:'var(--foreground)'});

        label(left,201,`Player sees at ${state.time} ms · ${visible}`,{class:'lane-label'});
        for(let t=25;t&lt;225;t+=25) {
          const world=t-25;
          const isMid=t%50===0;
          const name=(isMid?'M':'K')+world;
          const first=t===sampled, full=t===fullAt;
          const tip=`Shown from ${t} to ${t+25} ms: ${isMid?`midpoint of K${world-25} and K${world+25}`:`K${world} intact`}. Pose timestamp ${world} ms. ${first?'First picture that can show the new input.':full?'First full keyframe affected by the new input.':t&gt;sampled?'Contains the held input.':'Before the input response.'}`;
          el('rect',{x:x(t)+1,y:211,width:x(t+25)-x(t)-2,height:34,rx:2,class:'picture','data-tooltip':tip});
          if(t&gt;=sampled) el('rect',{x:x(t)+1,y:241,width:x(t+25)-x(t)-2,height:4,class:'input'});
          const centre=(x(t)+x(t+25))/2;
          if(narrow) {
            label(centre,224,isMid?'M':'K',{'text-anchor':'middle'});
            label(centre,237,world,{'text-anchor':'middle'});
          } else label(centre,232,name,{'text-anchor':'middle'});
        }
        el('path',{d:`M ${cursor-4} 206 L ${cursor+4} 206 L ${cursor} 211 Z`,fill:'var(--foreground)'});

        function range(y,from,to,title,kind) {
          label(left,y,title,{class:'lane-label'});
          const a=x(from), b=x(to);
          if(to&gt;from) el('rect',{x:a,y:y+10,width:b-a,height:5,class:kind});
          el('circle',{cx:a,cy:y+12.5,r:3,class:kind});
          if(to&gt;from) el('circle',{cx:b,cy:y+12.5,r:3,class:kind});
          const near=Math.abs(b-a)&lt;45;
          if(near) label((a+b)/2,y+32,from===to?`${from} ms`:`${from} → ${to} ms`,{'text-anchor':'middle',class:'axis-label'});
          else {
            label(a,y+32,from+' ms',{'text-anchor':'middle',class:'axis-label'});
            label(b,y+32,to+' ms',{'text-anchor':'middle',class:'axis-label'});
          }
        }
        range(278,pose,state.time,`Picture age vs real time · ${pictureAge} ms`,'gap-real');
        range(337,pose,physics,`Picture behind latest physics · ${physicsGap} ms`,'gap-physics');
        range(396,state.press,sampled,`Key → M${sampled-25} (first effect) · ${inputDelay} ms`,'input');
        range(455,state.press,fullAt,`Key → K${sampled} (full frame) · ${fullDelay} ms`,'input');

        drawing.querySelectorAll('text').forEach(node=&gt;{
          const bounds=node.getBBox();
          if(bounds.x&lt;3) node.setAttribute('x',Number(node.getAttribute('x'))+3-bounds.x);
          else if(bounds.x+bounds.width&gt;w-3) node.setAttribute('x',Number(node.getAttribute('x'))+w-3-bounds.x-bounds.width);
        });

        const mix=midpoint?`${visible} = ½ K${pose-25} + ½ K${pose+25}`:`${visible} = completed keyframe at ${pose} ms`;
        root.querySelector('#ss-selected').textContent=mix;
        root.querySelector('#ss-svg-description').textContent=`At real time ${state.time} ms, physics holds K${physics}; the displayed picture is ${visible}, representing pose time ${pose} ms. Its age against real time is ${pictureAge} ms, and it is ${physicsGap} ms behind latest physics. A held key pressed at ${state.press} ms is sampled into K${sampled}. It can first affect the picture at ${sampled} ms (${inputDelay} ms later). K${sampled} is displayed intact at ${fullAt} ms (${fullDelay} ms after pressing). Rendering and display delays are excluded.`;
      }
      inspect.addEventListener('input',()=&gt;{state.time=Number(inspect.value);render();});
      key.addEventListener('input',()=&gt;{state.press=Number(key.value);render();});
      inspect.addEventListener('change',save); key.addEventListener('change',save);
      svg.addEventListener('click',event=&gt;{
        const rect=svg.getBoundingClientRect();
        const localY=event.clientY-rect.top;
        if(localY&gt;250) return;
        state.time=Math.max(50,Math.min(220,Math.round(25+(event.clientX-rect.left-12)/(rect.width-24)*200)));
        render();save();
      });
      restore(window.openai &amp;&amp; window.openai.widgetState);
      window.addEventListener('openai:set_globals',event=&gt;{
        if(event.detail &amp;&amp; event.detail.globals &amp;&amp; Object.prototype.hasOwnProperty.call(event.detail.globals,'widgetState')) {
          restore(event.detail.globals.widgetState);render();
        }
      });
      new ResizeObserver(()=&gt;{if(Math.abs(root.getBoundingClientRect().width-lastWidth)&gt;0.5)render();}).observe(root);
      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;


&lt;style id=&quot;codex-visualization-document-scrollbar&quot;&gt;html,body{scrollbar-width:none!important}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none!important}&lt;/style&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = '.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]';
  const disabled = ':disabled,[aria-disabled=&quot;true&quot;]';
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest('[role=&quot;tablist&quot;]').querySelectorAll('[role=&quot;tab&quot;]')) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role=&quot;tablist&quot;]').querySelectorAll('[role=&quot;tab&quot;]'),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role=&quot;tablist&quot;]')) {
    const selected =
      list.querySelector('[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]') ??
      list.querySelector('[role=&quot;tab&quot;].active') ??
      list.querySelector('[role=&quot;tab&quot;]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener(&quot;click&quot;, interact);
  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();

<script>(() => {
  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;

  let state = null;

    const probeKey = `${storageKey}:probe`;

    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);

      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }

  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });

    }
    if (data.type === "height") {
      const height = data.height;

        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {

    }

        typeof top === "number" &&
        Number.isFinite(top) &&

      return;
    }

      const rawHref = data.href;
      if (typeof rawHref !== "string") {

      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;

        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";

        anchor.click();
        anchor.remove();

      return;

      const prompt = data.prompt;

        typeof prompt !== "string" ||

    "load",
    () => {

  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
