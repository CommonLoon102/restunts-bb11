name: PR validation

# Blocks a pull request when any executable fails to build, full physics
# validation fails, or sampled renderer output differs from pixldumo.
on:
  #push:
  #  branches: [cl102/feat]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platforms:
        description: Nonempty JSON array of unique candidate platforms (dos, sdl3).
        type: string
        default: '["sdl3"]'
      cameras:
        description: Nonempty JSON array of unique renderer camera IDs (integers 1-4).
        type: string
        default: '[1,2,3,4]'
      target:
        description: Renderer target (0 for player, 1 for opponent).
        type: number
        default: 0
      renderer-test-percentage:
        description: Percentage of golden replays sampled for renderer tests (integer 1-100).
        type: number
        default: 100

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Golden replays
    uses: ./.github/workflows/build-and-validate.yml
    with:
      platforms: ${{ github.event.inputs.platforms || '["sdl3"]' }}
      # Every run packages DOS16, including an SDL3-only replay test selection.
      build-dos-artifact: true
      cameras: ${{ github.event.inputs.cameras || '[1,2,3,4]' }}
      target: ${{ fromJSON(github.event.inputs.target || '0') }}
      renderer-test-percentage: ${{ fromJSON(github.event.inputs.renderer-test-percentage || '100') }}

  packages:
    name: All release packages
    needs: validate
    uses: ./.github/workflows/build-packages.yml
    with:
      dos-artifact: ${{ needs.validate.outputs.exe-artifact }}
      attest: false
