name: PR validation

# Blocks a pull request when any executable fails to build, full physics
# validation fails, or sampled renderer output differs from pixldumo.
on:
  push:
    branches: [c-port32-skip-ci]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      camera:
        description: Renderer camera (integer 1-4, corresponding to F1-F4).
        type: number
        default: 2
      target:
        description: Renderer target (0 for player, 1 for opponent).
        type: number
        default: 0
      renderer-test-percentage:
        description: Percentage of golden replays sampled for renderer tests (integer 1-100).
        type: number
        default: 100

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Golden replays
    uses: ./.github/workflows/build-and-validate.yml
    with:
      camera: ${{ fromJSON(github.event.inputs.camera || '2') }}
      target: ${{ fromJSON(github.event.inputs.target || '0') }}
      renderer-test-percentage: ${{ fromJSON(github.event.inputs.renderer-test-percentage || '100') }}
