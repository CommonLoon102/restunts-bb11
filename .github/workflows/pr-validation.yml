name: PR validation

# Blocks a pull request when any executable fails to build, full physics
# validation fails, or sampled renderer output differs from pixldumo.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      renderer-test-percentage:
        description: Percentage of golden replays sampled for renderer tests (integer 1-100).
        type: number
        default: 5

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Golden replays
    uses: ./.github/workflows/build-and-validate.yml
    with:
      renderer-test-percentage: ${{ fromJSON(github.event.inputs.renderer-test-percentage || '5') }}
