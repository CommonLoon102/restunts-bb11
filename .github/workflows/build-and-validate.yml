name: Build and validate

# Checks C/H formatting, runs the host regression tests, builds six DOS
# executables and runs full physics plus sampled renderer replay comparisons.
# PR and release workflows both gate on this validation.
on:
  workflow_call:
    inputs:
      shards:
        description: >-
          Number of parallel replay jobs. A public repository on the free
          plan may run 20 jobs at once account wide, so 20 uses the whole
          allowance and any other workflow queues behind this one.
        type: number
        default: 20
      partitions-per-shard:
        description: >-
          Partitions each replay job runs concurrently. DOSBox slows down
          roughly in proportion to how far the partitions oversubscribe the
          runner's four vCPUs, so raising this needs replay-timeout-seconds
          raised to match.
        type: number
        default: 12
      replay-timeout-seconds:
        description: Seconds each physics executable gets per replay.
        type: number
        default: 300
      renderer-test-percentage:
        description: Percentage of golden replays sampled for renderer tests (integer 1-100).
        type: number
        default: 100
      renderer-timeout-seconds:
        description: Seconds each renderer executable gets per replay.
        type: number
        default: 600
    outputs:
      exe-artifact:
        description: Artifact holding the six built executables.
        value: ${{ jobs.build.outputs.exe-artifact }}

env:
  EXE_ARTIFACT: restunts-exes
  WINEDEBUG: -all
  # Keep wineboot from prompting to download Mono and Gecko.
  WINEDLLOVERRIDES: mscoree,mshtml=

jobs:
  formatting:
    name: C/H formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned formatting tools
        run: python3 -m pip install -r tools/scripts/requirements-format.txt

      - name: Validate C/H formatting against .editorconfig
        run: ec

      - name: Validate C layout and braces with clang-format
        run: git ls-files -z 'src/*.c' 'src/*.h' | xargs -0 -r clang-format --dry-run --Werror

  dumpsrv-tests:
    name: C# regression service tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test the shared regression engine and HTTP service
        run: dotnet test tools/scripts/dumpsrv/dumpsrv.slnx --configuration Release

      - name: Test the POSIX client
        run: python3 tools/scripts/dumpsrv/dumpsrv.tests/client-tests.py

      - name: Check C# formatting
        run: dotnet format tools/scripts/dumpsrv/dumpsrv.slnx --verify-no-changes --no-restore

  plan:
    name: Plan the shards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Split the golden set into shards
        id: plan
        env:
          SHARDS: ${{ inputs.shards }}
          PARTITIONS_PER_SHARD: ${{ inputs.partitions-per-shard }}
          RENDERER_TEST_PERCENTAGE: ${{ inputs.renderer-test-percentage }}
        run: |
          set -u
          if [[ ! "$SHARDS" =~ ^[1-9][0-9]{0,9}$ ]] || (( SHARDS > 2147483647 )); then
              echo "::error::shards must be an integer from 1 to 2147483647"
              exit 1
          fi
          if [[ ! "$PARTITIONS_PER_SHARD" =~ ^([1-9]|[1-5][0-9]|6[0-4])$ ]]; then
              echo "::error::partitions-per-shard must be an integer from 1 to 64"
              exit 1
          fi
          if [[ ! "$RENDERER_TEST_PERCENTAGE" =~ ^([1-9][0-9]?|100)$ ]]; then
              echo "::error::renderer-test-percentage must be an integer from 1 to 100"
              exit 1
          fi
          echo "shards=[$(seq 0 $(( SHARDS - 1 )) | paste -sd, -)]" >> "$GITHUB_OUTPUT"

  host-tests:
    name: Host regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Compile and run the host tests
        run: bash src/restunts/tests/run-host-tests.sh

  build:
    name: Build executables
    needs: [formatting, dumpsrv-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      exe-artifact: ${{ steps.names.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - name: Publish the artifact name
        id: names
        run: echo "value=$EXE_ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Install Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # bcc.exe, tasm32.exe, make.exe and the bundled DOSBox.exe are all
          # 32 bit PE binaries, so the i386 side of Wine is required.
          sudo apt-get install -y --no-install-recommends wine wine32:i386 xvfb

      - name: "Create the Wine prefix and map S: to the checkout"
        run: |
          xvfb-run -a wineboot --init
          wineserver -w
          # Every makefile addresses its sources as s:\..., the drive letter
          # tools/mount_stunts_to_s.bat creates on Windows.
          mkdir -p "$HOME/.wine/dosdevices"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/.wine/dosdevices/s:"

      - name: Build the game and physics executables
        run: |
          xvfb-run -a wine cmd /D /S /C "S: && cd S:\src\restunts && makerepldump"

      - name: Build the renderer executables
        run: |
          xvfb-run -a wine cmd /D /S /C "S: && cd S:\src\restunts && makepixldump"

      - name: Collect the executables
        run: |
          set -u
          mkdir -p dist
          missing=0
          # makerepldump.bat never reports failure, and a fresh checkout carries
          # none of these files, so their presence is the build's pass criteria.
          for exe in restunts restunto repldump repldumo pixldump pixldumo; do
              built=$(find stunts src/restunts/dos src/restunts/repldump src/restunts/pixldump \
                  -maxdepth 1 -iname "$exe.exe" -print -quit)
              if [[ -z "$built" ]]; then
                  echo "::error::$exe.exe was not produced by the build"
                  missing=1
                  continue
              fi
              cp -- "$built" "dist/$exe.exe"
          done
          (( missing == 0 )) || exit 1
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXE_ARTIFACT }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  replay:
    name: Replays (shard ${{ matrix.shard }})
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish the shared regression runner
        run: dotnet publish tools/scripts/dumpsrv/dumpsrv/dumpsrv.csproj --configuration Release --output "$RUNNER_TEMP/dumpsrv"

      - name: Install DOSBox-X
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dosbox-x

      - name: Initialize DOSBox-X before concurrent runs
        run: |
          timeout --signal=KILL 30s dosbox-x -silent \
              -conf tools/scripts/dosbox.proc.conf \
              -c "mount c $RUNNER_TEMP" -c "c:" -c "exit"

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.exe-artifact }}
          path: exes

      - name: Assemble the game directory
        run: |
          set -u
          game_dir="$RUNNER_TEMP/gamedir"
          mkdir -p "$game_dir"
          cp -R stunts/. "$game_dir/"
          # The archived golden corpus is the complete replay set for CI.
          find "$game_dir" -maxdepth 1 -type f -iname '*.rpl' -delete
          cp tools/scripts/cars/*.RES tools/scripts/cars/*.3SH \
             tools/scripts/cars/*.VSH tools/scripts/cars/*.PVS "$game_dir/"
          cp exes/*.exe "$game_dir/"
          # Generate missing cache entries with the same archived Borland oracles.
          (cd tools/oracles/borland && sha256sum --check SHA256SUMS)
          cp tools/oracles/borland/repldumo.exe tools/oracles/borland/pixldumo.exe "$game_dir/"
          unzip -q tools/scripts/rpls_golden/replays.zip -d "$game_dir"
          echo "GAME_DIR=$game_dir" >> "$GITHUB_ENV"

      - name: Download and extract this shard's precomputed oracle outputs
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
          RENDERER_TEST_PERCENTAGE: ${{ inputs.renderer-test-percentage }}
          ORACLE_URL: https://github.com/CommonLoon102/restunts4d-oracles/releases/download/v1.0.0
        run: |
          set -eu
          for archive in BINs PDOs; do
              zip_path="$RUNNER_TEMP/$archive.zip"
              # Download the versioned release assets.
              curl --fail --location --silent --show-error --retry 3 \
                  --connect-timeout 20 "$ORACLE_URL/$archive.zip" --output "$zip_path"
              renderer=false
              if [[ "$archive" == "PDOs" ]]; then
                  renderer=true
              fi
              # The full BIN archive expands to over 15 GB. Extract only assigned
              # replays, using the same sampling and sharding as the test runner.
              dotnet "$RUNNER_TEMP/dumpsrv/dumpsrv.dll" extract-oracles \
                  -GameDirectory "$GAME_DIR" -Archive "$zip_path" \
                  -Renderer "$renderer" -RendererTestPercentage "$RENDERER_TEST_PERCENTAGE" \
                  -ShardIndex "$SHARD" -ShardCount "$SHARDS"
              rm -- "$zip_path"
          done

      - name: Run this shard's physics and renderer tests
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
          PARTITIONS_PER_SHARD: ${{ inputs.partitions-per-shard }}
          REPLAY_TIMEOUT_SECONDS: ${{ inputs.replay-timeout-seconds }}
          RENDERER_TEST_PERCENTAGE: ${{ inputs.renderer-test-percentage }}
          RENDERER_TIMEOUT_SECONDS: ${{ inputs.renderer-timeout-seconds }}
        run: |
          dotnet "$RUNNER_TEMP/dumpsrv/dumpsrv.dll" run \
              -GameDirectory "$GAME_DIR" \
              -OutputDirectory partitions \
              -DosBoxConfigPath tools/scripts/dosbox.proc.conf \
              -PartitionCount "$PARTITIONS_PER_SHARD" \
              -ShardIndex "$SHARD" -ShardCount "$SHARDS" \
              -DosBoxTimeoutSeconds "$REPLAY_TIMEOUT_SECONDS" \
              -RendererTimeoutSeconds "$RENDERER_TIMEOUT_SECONDS" \
              -RendererTestPercentage "$RENDERER_TEST_PERCENTAGE"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: partitions-${{ matrix.shard }}
          path: partitions/*.json
          # Missing shards are diagnosed by the shared merge command.
          if-no-files-found: warn
          retention-days: 14

      - name: Upload this shard's PDO files
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: renderer-pdo-${{ matrix.shard }}
          path: ${{ runner.temp }}/gamedir/**/*.[pP][dD][oO]
          include-hidden-files: true
          # A shard may have no replays in the renderer sample.
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Replay report
    needs: [plan, replay]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish the shared regression runner
        run: dotnet publish tools/scripts/dumpsrv/dumpsrv/dumpsrv.csproj --configuration Release --output "$RUNNER_TEMP/dumpsrv"

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: partitions-*
          merge-multiple: true
          path: partitions

      - name: Merge the shard results and check coverage
        env:
          SHARDS: ${{ inputs.shards }}
          RENDERER_TEST_PERCENTAGE: ${{ inputs.renderer-test-percentage }}
        run: |
          mkdir -p partitions "$RUNNER_TEMP/replays"
          unzip -q tools/scripts/rpls_golden/replays.zip -d "$RUNNER_TEMP/replays"
          dotnet "$RUNNER_TEMP/dumpsrv/dumpsrv.dll" merge \
              -ReplayDirectory "$RUNNER_TEMP/replays" \
              -ResultsDirectory partitions -ShardCount "$SHARDS" \
              -RendererTestPercentage "$RENDERER_TEST_PERCENTAGE" \
              -OutputFile partitions_all.txt \
              -SummaryFile "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: partitions_all
          path: partitions_all.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Combine all PDO files into a downloadable ZIP
        uses: actions/upload-artifact/merge@v7
        if: always()
        with:
          name: renderer-pdo
          pattern: renderer-pdo-*
          include-hidden-files: true
          retention-days: 14

      - name: Check replay jobs completed successfully
        if: always()
        env:
          REPLAY_RESULT: ${{ needs.replay.result }}
        run: |
          if [[ "$REPLAY_RESULT" != "success" ]]; then
              echo "::error::a replay shard did not finish successfully (result: $REPLAY_RESULT)"
              printf '\n:x: A replay shard did not finish successfully (result: **%s**).\n' \
                  "$REPLAY_RESULT" >> "$GITHUB_STEP_SUMMARY"
              exit 1
          fi
