name: Build and validate

# Checks formatting, the regression services and host tests, and plans shards
# in parallel. Then builds, validates physics, validates rendering, and reports.
# PR and release workflows both gate on this validation.
on:
  workflow_call:
    inputs:
      platforms:
        description: Nonempty JSON array of unique candidate platforms (dos, sdl3).
        type: string
        default: '["dos","sdl3"]'
      build-dos-artifact:
        description: Build DOS release executables even when DOS replay tests are not selected.
        type: boolean
        default: false
      shards:
        description: >-
          Number of parallel replay jobs. A public repository on the free
          plan may run 20 jobs at once account wide, so 20 uses the whole
          allowance and any other workflow queues behind this one.
        type: number
        default: 20
      partitions-per-shard:
        description: >-
          Partitions each replay job runs concurrently. DOSBox slows down
          roughly in proportion to how far the partitions oversubscribe the
          runner's four vCPUs, so raising this needs replay-timeout-seconds
          raised to match.
        type: number
        default: 5
      replay-timeout-seconds:
        description: Seconds each physics executable gets per replay.
        type: number
        default: 120
      cameras:
        description: Nonempty JSON array of unique renderer camera IDs (integers 1-4).
        type: string
        default: '[2]'
      target:
        description: Renderer target (0 for player, 1 for opponent).
        type: number
        default: 0
      renderer-test-percentage:
        description: Percentage of golden replays sampled for renderer tests (integer 1-100).
        type: number
        default: 100
      renderer-timeout-seconds:
        description: Seconds each renderer executable gets per replay.
        type: number
        default: 980
    outputs:
      exe-artifact:
        description: Artifact holding the six DOS executables, when a DOS build is requested.
        value: ${{ jobs.build.outputs.exe-artifact }}

env:
  EXE_ARTIFACT: restunts-exes

jobs:
  formatting:
    name: C/H formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned formatting tools
        run: python3 -m pip install -r tools/scripts/requirements-format.txt

      - name: Validate C/H formatting against .editorconfig
        run: ec

      - name: Validate C layout and braces with clang-format
        run: git ls-files -z 'src/*.c' 'src/*.h' | xargs -0 -r clang-format --dry-run --Werror

  dumpsrv-tests:
    name: C# regression service tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test the shared regression engine and HTTP service
        run: dotnet test tools/scripts/dumpsrv/dumpsrv.slnx --configuration Release

      - name: Test the POSIX client
        run: python3 tools/scripts/dumpsrv/dumpsrv.tests/client-tests.py

      - name: Check C# formatting
        run: dotnet format tools/scripts/dumpsrv/dumpsrv.slnx --verify-no-changes --no-restore

  host-tests:
    name: Host regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Compile and run the host tests
        run: bash src/restunts/tests/run-host-tests.sh

  plan:
    name: Plan the shards
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      platforms: ${{ steps.platforms.outputs.platforms }}
      cameras: ${{ steps.cameras.outputs.cameras }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate candidate platforms
        id: platforms
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          if ! platforms=$(jq -ces '
              select(length == 1) | .[0] |
              select(type == "array" and length > 0) |
              select(all(.[]; . == "dos" or . == "sdl3")) |
              select(length == (unique | length))
          ' <<< "$PLATFORMS"); then
              echo '::error::platforms must be a nonempty JSON array of unique values: dos, sdl3'
              exit 1
          fi
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"

      - name: Validate renderer cameras
        id: cameras
        env:
          CAMERAS: ${{ inputs.cameras }}
        run: |
          if ! cameras=$(jq -ces '
              select(length == 1) | .[0] |
              select(type == "array" and length > 0) |
              select(all(.[]; type == "number" and . >= 1 and . <= 4 and . == floor)) |
              select(length == (unique | length))
          ' <<< "$CAMERAS"); then
              echo "::error::cameras must be a nonempty JSON array of unique integers from 1 to 4"
              exit 1
          fi
          echo "cameras=$cameras" >> "$GITHUB_OUTPUT"

      - name: Test tick-based shard planning
        run: python3 tools/scripts/test-plan-replay-shards.py

      - name: Test renderer input scenery normalization
        run: python3 tools/scripts/test-normalize-track-skybox.py

      - name: Split the golden set into shards
        id: plan
        env:
          SHARDS: ${{ inputs.shards }}
          PARTITIONS_PER_SHARD: ${{ inputs.partitions-per-shard }}
          TARGET: ${{ inputs.target }}
          RENDERER_TEST_PERCENTAGE: ${{ inputs.renderer-test-percentage }}
        run: |
          set -eu
          if [[ ! "$SHARDS" =~ ^[1-9][0-9]{0,9}$ ]] || (( SHARDS > 2147483647 )); then
              echo "::error::shards must be an integer from 1 to 2147483647"
              exit 1
          fi
          if [[ ! "$PARTITIONS_PER_SHARD" =~ ^([1-9]|[1-5][0-9]|6[0-4])$ ]]; then
              echo "::error::partitions-per-shard must be an integer from 1 to 64"
              exit 1
          fi
          if [[ ! "$RENDERER_TEST_PERCENTAGE" =~ ^([1-9][0-9]?|100)$ ]]; then
              echo "::error::renderer-test-percentage must be an integer from 1 to 100"
              exit 1
          fi
          python3 tools/scripts/plan-replay-shards.py \
              --replays tools/scripts/rpls_golden/replays.zip \
              --shards "$SHARDS" --renderer-test-percentage "$RENDERER_TEST_PERCENTAGE" \
              --target "$TARGET" --output shard-plan.json --summary "$GITHUB_STEP_SUMMARY"
          echo "shards=[$(seq 0 $(( SHARDS - 1 )) | paste -sd, -)]" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: replay-shard-plan
          path: shard-plan.json
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build DOS executables
    needs: [formatting, dumpsrv-tests, host-tests, plan]
    if: inputs.build-dos-artifact || contains(fromJSON(needs.plan.outputs.platforms), 'dos')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      exe-artifact: ${{ steps.names.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - name: Publish the artifact name
        id: names
        run: echo "value=$EXE_ARTIFACT" >> "$GITHUB_OUTPUT"

      - name: Install pinned Open Watcom 2
        run: bash tools/scripts/install-open-watcom.sh

      - name: Test the assembler and linker adapters
        run: |
          python3 -m unittest discover -s tools/scripts/tests -p 'test_*.py'
          python3 tools/scripts/test-compare-dos-artifacts.py

      - name: Download and extract the game assets
        env:
          STUNTS_URL: https://github.com/CommonLoon102/restunts4d-oracles/releases/download/v1.0.1/BB11.zip
        run: |
          set -eu
          zip_path="$RUNNER_TEMP/BB11.zip"
          trap 'rm -f -- "$zip_path"' EXIT
          curl --fail --location --silent --show-error --retry 3 \
              --connect-timeout 20 "$STUNTS_URL" --output "$zip_path"
          unzip -oq "$zip_path" -d stunts

      - name: Build all six DOS executables
        run: |
          make -C src/restunts restunts repldump pixldump
          make -C src/restunts restunts-original repldump-original pixldump-original

      - name: Check the DOS platform ABI and dump timer masking
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dosbox-x
          make -C src/restunts test-dos-platform
          python3 tools/scripts/run-dos-platform-test.py

      - name: Collect the executables
        run: |
          set -eu
          mkdir -p dist
          for exe in restunts restunto repldump repldumo pixldump pixldumo; do
              test -s "stunts/$exe.exe"
              cp -- "stunts/$exe.exe" "dist/$exe.exe"
          done
          ls -l dist

      - name: Check the renderer address model against the built oracle
        run: python3 tools/scripts/test-pixldump-legacy-layout.py --executable dist/pixldumo.exe

      - name: Check original dump failure cleanup
        run: python3 tools/scripts/test-original-dump-exits.py --executable dist/repldumo.exe

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.EXE_ARTIFACT }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  build-sdl3:
    name: Build SDL3 executables (Linux x64)
    needs: [formatting, dumpsrv-tests, host-tests, plan]
    if: contains(fromJSON(needs.plan.outputs.platforms), 'sdl3')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libudev-dev libdrm-dev libgbm-dev \
            libegl1-mesa-dev libgl1-mesa-dev

      - name: Download and extract the game assets
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/CommonLoon102/restunts4d-oracles/releases/download/v1.0.1/BB11.zip \
            --output "$RUNNER_TEMP/BB11.zip"
          unzip -oq "$RUNNER_TEMP/BB11.zip" -d stunts

      - name: Build the SDL3 game and dump tools
        run: |
          cmake -S . -B build/sdl3 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DRESTUNTS_BUILD_TESTS=ON
          cmake --build build/sdl3 --parallel 2

      - name: Run SDL3 platform regressions
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build/sdl3 --output-on-failure

      - name: Package the SDL3 runtime with executable permissions
        run: |
          cmake --install build/sdl3 --prefix "$RUNNER_TEMP/sdl3" --component Runtime
          tar -C "$RUNNER_TEMP/sdl3" -czf sdl3-runtime.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: restunts-sdl3-replay-exes
          path: sdl3-runtime.tar.gz
          if-no-files-found: error
          retention-days: 14

  physics:
    name: Physics replays (${{ matrix.platform }})
    needs: [build, build-sdl3, plan]
    # An unselected build is intentionally skipped; selected builds must pass.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          (needs.build.result == 'success' ||
           (needs.build.result == 'skipped' && !inputs.build-dos-artifact &&
            !contains(fromJSON(needs.plan.outputs.platforms), 'dos'))) &&
          (needs.build-sdl3.result == 'success' ||
           (needs.build-sdl3.result == 'skipped' &&
            !contains(fromJSON(needs.plan.outputs.platforms), 'sdl3'))) }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
    uses: ./.github/workflows/replay-tests.yml
    with:
      phase: physics
      candidate-platform: ${{ matrix.platform }}
      exe-artifact: ${{ needs.build.outputs.exe-artifact }}
      native-artifact: restunts-sdl3-replay-exes
      shard-matrix: ${{ needs.plan.outputs.shards }}
      shard-plan-artifact: replay-shard-plan
      shards: ${{ inputs.shards }}
      partitions-per-shard: ${{ inputs.partitions-per-shard }}
      replay-timeout-seconds: ${{ inputs.replay-timeout-seconds }}
      # Physics runs once per platform; the first camera is only report metadata.
      camera: ${{ fromJSON(needs.plan.outputs.cameras)[0] }}
      target: ${{ inputs.target }}
      renderer-test-percentage: ${{ inputs.renderer-test-percentage }}
      renderer-timeout-seconds: ${{ inputs.renderer-timeout-seconds }}

  renderer:
    name: Renderer replays (${{ matrix.platform }}, camera ${{ matrix.camera }})
    needs: [build, plan, physics]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs.physics.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
        camera: ${{ fromJSON(needs.plan.outputs.cameras) }}
    uses: ./.github/workflows/replay-tests.yml
    with:
      phase: renderer
      candidate-platform: ${{ matrix.platform }}
      exe-artifact: ${{ needs.build.outputs.exe-artifact }}
      native-artifact: restunts-sdl3-replay-exes
      shard-matrix: ${{ needs.plan.outputs.shards }}
      shard-plan-artifact: replay-shard-plan
      shards: ${{ inputs.shards }}
      partitions-per-shard: ${{ inputs.partitions-per-shard }}
      replay-timeout-seconds: ${{ inputs.replay-timeout-seconds }}
      camera: ${{ matrix.camera }}
      target: ${{ inputs.target }}
      renderer-test-percentage: ${{ inputs.renderer-test-percentage }}
      renderer-timeout-seconds: ${{ inputs.renderer-timeout-seconds }}

  report:
    name: Replay report (${{ matrix.platform }}, camera ${{ matrix.camera }})
    needs: [plan, physics, renderer]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' &&
          needs.physics.result == 'success' && needs.renderer.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.plan.outputs.platforms) }}
        camera: ${{ fromJSON(needs.plan.outputs.cameras) }}
    steps:
      - name: Download the shared physics report
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.platform == 'sdl3' && 'sdl3-' || '' }}physics-cam${{ fromJSON(needs.plan.outputs.cameras)[0] }}-target${{ inputs.target }}-report
          path: reports/physics

      - name: Download this camera's renderer report
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.platform == 'sdl3' && 'sdl3-' || '' }}renderer-cam${{ matrix.camera }}-target${{ inputs.target }}-report
          path: reports/renderer

      - name: Combine physics and renderer diagnostics
        run: |
          cat reports/physics/partitions_all.txt \
              reports/renderer/partitions_all.txt > partitions_all.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.platform == 'sdl3' && 'sdl3-' || '' }}partitions_all-cam${{ matrix.camera }}-target${{ inputs.target }}
          path: partitions_all.txt
          if-no-files-found: warn
          retention-days: 14
